@"
name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium

      - name: Create required folders
        run: |
          mkdir -p reports screenshots data videos

      - name: Run smoke tests
        run: |
          pytest tests/smoke/ -v --html=reports/smoke-report.html --self-contained-html
        continue-on-error: true

      - name: Run API tests
        run: |
          pytest tests/e2e/test_api.py -v
        continue-on-error: true

      - name: Run report demo tests
        run: |
          pytest tests/e2e/test_report_demo.py -v --html=reports/e2e-report.html --self-contained-html
        continue-on-error: true

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
"@ | Out-File -FilePath .github\workflows\playwright.yml -Encoding ascii