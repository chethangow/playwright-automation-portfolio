@"
name: Playwright Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Install browsers
        run: playwright install chromium
      - name: Create folders
        run: mkdir -p reports screenshots data videos
      - name: Run smoke tests
        run: pytest tests/smoke/ -v
        continue-on-error: true
      - name: Run API tests
        run: pytest tests/e2e/test_api.py -v
        continue-on-error: true
      - name: Run e2e tests
        run: pytest tests/e2e/test_report_demo.py -v
        continue-on-error: true
      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: reports/
"@ | Out-File -FilePath .github\workflows\playwright.yml -Encoding ascii